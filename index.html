.transition{
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-all{
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-transform{
  transition-property: transform;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;

.duration-500{

.ease-out{
  transition-timing-function: cubic-bezier(0, 0, 0.2, 1);

.\[overflow-wrap\:anywhere\]{
  overflow-wrap: anywhere;

:root{
  --navy:#0c2a1e;
  --navy-2:#123a2a;
  --green:#146743;
  --gold:#d9a91e;
  --gold-2:#f2cf5e;
  --cream:#fbf6ec;
  --cream-2:#fffdf7;
  --ink:#17251e;
  --muted:#66706a;
  --surface:#fffdf7;
  --line:#e9dcba;
  --coral:#ff5d73;
}

@media (prefers-color-scheme: dark){
  :root{
    --navy:#071d13;
    --navy-2:#0d2f21;
    --cream:#101a14;
    --cream-2:#0b1610;
    --ink:#fdf6dd;
    --muted:#b8c2b8;
    --surface:#0d2118;
    --line:#2a4435;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,sans-serif
}

.font-display{
  font-family:"Fraunces","Plus Jakarta Sans",serif
}

a{
  color:inherit
}

input,select,textarea{
  font:inherit
}

.field{
  width:100%;
  border:2px solid var(--line);
  border-radius:16px;
  background:#fff;
  padding:14px 15px;
  color:#14211b;
  outline:none
}

.field:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 4px rgba(217,169,30,.18)
}

@media (prefers-color-scheme: dark){
  .field{
    background:#071d13;
    color:#fff
  }
}

.chip{
  border:2px solid var(--line);
  background:#fff;
  border-radius:999px;
  padding:11px 10px;
  font-weight:800;
  font-size:14px;
  cursor:pointer;
  text-align:center;
  color:#17251e;
  transition:.2s
}

.chip:hover{
  transform:translateY(-1px);
  border-color:var(--gold)
}

.chip[aria-pressed="true"]{
  background:var(--navy);
  color:#fff;
  border-color:var(--navy)
}

@media (prefers-color-scheme: dark){
  .chip{
    background:#0b1610;
    color:#fff
  }
}

.btn-gold{
  background:linear-gradient(180deg,#f2cf5e,#d9a91e);
  color:#231700;
  box-shadow:0 8px 0 #a67c08;
  transition:.15s
}

.btn-gold:hover{
  filter:brightness(1.03)
}

.btn-gold:active{
  transform:translateY(3px);
  box-shadow:0 3px 0 #a67c08
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

@keyframes marquee{
  from{
    transform:translateX(0)
  }

  to{
    transform:translateX(-50%)
  }
}

.marquee-track{
  display:flex;
  width:-moz-max-content;
  width:max-content;
  animation:marquee 22s linear infinite
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0) rotate(var(--r,0deg))
  }

  50%{
    transform:translateY(-8px) rotate(var(--r,0deg))
  }
}

.floaty{
  animation:floaty 4.5s ease-in-out infinite
}

.luxury-title{
  font-size:clamp(1.75rem,7.2vw,4.5rem);
  line-height:1.08;
  letter-spacing:.06em;
  background:linear-gradient(110deg,#B8860B 0%,#FFD700 18%,#FFF8DC 30%,#FFD700 42%,#B8860B 58%,#FFD700 74%,#FFF8DC 86%,#B8860B 100%);
  background-size:220% auto;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  -webkit-text-fill-color:transparent;
  animation:gold-shine 4.5s linear infinite;
  filter:drop-shadow(0 0 14px rgba(255,215,0,.32)) drop-shadow(0 2px 2px rgba(0,0,0,.45));
  overflow-wrap:anywhere
}

.luxury-rule{
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,215,0,.2),#FFD700,#FFF8DC,#FFD700,rgba(255,215,0,.2),transparent)
}

@keyframes gold-shine{
  from{
    background-position:200% center
  }

  to{
    background-position:-20% center
  }
}

@keyframes pop{
  from{
    opacity:0;
    transform:translateY(18px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

.reveal{
  opacity:0;
  transform:translateY(22px);
  transition:opacity .7s ease,transform .7s ease
}

.reveal.is-visible{
  opacity:1;
  transform:none;
  animation:pop .7s ease both
}

@media (prefers-reduced-motion: reduce){
  .marquee-track,.floaty,.luxury-title{
    animation:none
  }

  .reveal{
    opacity:1;
    transform:none
  }
}

<script>
(function(){
  var FORM_URL = "https://forms.gle/CMNhDiG1rcr1ed9T8";
  var KEY = "pas7_github_fix_v1";
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ return {}; } }
  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  var origFetch = window.fetch;
  window.fetch = function(url, opts){
    try{
      var u = typeof url === 'string' ? url : (url && url.url ? url.url : '');
      if(u === 'actions' || (typeof u==='string' && u.indexOf('actions')!==-1)){
        var body = {};
        try{ body = JSON.parse(opts && opts.body ? opts.body : '{}'); }catch(e){}
        var action = body.action || '';
        var args = body.args || {};
        var state = load();
        if(typeof state.interestCount !== 'number') state.interestCount = 0;
        if(!state.formUrl) state.formUrl = FORM_URL;
        var data = {};
        if(action === 'records.list'){
          var records = [];
          records.push({id:'google_form', value:{type:'google_form', url: state.formUrl}});
          records.push({id:'interest', value:{type:'interest', count: state.interestCount}});
          data = {records: records};
        } else if(action === 'records.create' || action === 'records.put' || action === 'records.replace'){
          var v = args.value || {};
          if(v.type === 'interest'){ state.interestCount = Number(v.count||0); save(state); data = {id:'interest', value:v}; }
          else if(v.type === 'google_form'){ state.formUrl = v.url || FORM_URL; save(state); data = {id:'google_form', value:v}; }
          else { data = {id: args.id || 'ok', value: v}; }
        } else if(action === 'records.get'){
          data = null;
        } else {
          data = {};
        }
        var json = JSON.stringify({data: data});
        return Promise.resolve(new Response(json, {status:200, headers:{'Content-Type':'application/json'}}));
      }
    }catch(e){}
    return origFetch.apply(this, arguments);
  };
})();
